      - patches/devtoolset/gcc15-libtool-no-rpath.patch
      - patches/devtoolset/gcc15-isl-dl.patch
      - patches/devtoolset/gcc15-isl-dl2.patch
      # - patches/devtoolset/gcc15-libstdc++-docs.patch
      - patches/devtoolset/gcc15-no-add-needed.patch
      - patches/devtoolset/gcc15-Wno-format-security.patch
      - patches/devtoolset/gcc15-rh1574936.patch
      - patches/devtoolset/gcc15-d-shared-libphobos.patch
      - patches/devtoolset/gcc15-pr119006.patch
      - patches/devtoolset/gcc15-pr123273.patch
      - patches/devtoolset/gcc15-pr123667.patch
      - patches/devtoolset/gcc15-pr123737.patch
      - patches/devtoolset/gcc15-fortran-fdec-duplicates.patch
      - patches/devtoolset/gcc15-libstdc++-compat.patch
      - patches/devtoolset/gcc15-libgfortran-compat.patch
      - patches/devtoolset/gcc15-nvptx-offload.patch
      - patches/devtoolset/isl-rh2155127.patch
      # - patches/devtoolset/0001-basic_string-reserve-n-semantics-are-not-available-i.patch
      # - patches/devtoolset/0004-operator-istream-char-N-eofbit-fixes-are-not-availab.patch
      # - patches/devtoolset/0005-Disable-tests-for-PR-libstdc-79820-and-PR-libstdc-81.patch
      # - patches/devtoolset/0006-Don-t-assume-has_facet-codecvt_c16-when-run-against-.patch
      # - patches/devtoolset/0008-testsuite-build-plugins-with-std-c-11.patch
      # - patches/devtoolset/0010-Don-t-verify-exception-handling-in-basic_filebuf-clo.patch
      # - patches/devtoolset/0011-Add-dts.exp-and-use-it-to-fix-22_locale-messages-136.patch
      # - patches/devtoolset/0012-dts.exp-use-usr-bin-gcc.patch
      # - patches/devtoolset/0013-Rename-__CXXSTDLIB_SO_VERSION__-to-__LIBSTDCXX_SO_VE.patch
      # - patches/devtoolset/0014-Conditionalize-tests-for-PR-libstdc-98466-on-__LIBST.patch
