  - url: https://sources.build.resf.org/c73799e9cf2ba6937eb0171d429afde186d4a45fe5b7abde6552c0c0d707fef7
    sha256: c73799e9cf2ba6937eb0171d429afde186d4a45fe5b7abde6552c0c0d707fef7   # [gcc_version == "15.2.1"]
    fn: gcc-15.2.1-20260123.tar.xz
