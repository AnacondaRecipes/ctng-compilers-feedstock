{% set version = gcc_version %}
{% set build_num = 8 %}

{% if gcc_maj_ver is not defined %}
{% set gcc_maj_ver = 15 %}
{% endif %}

# libgcc-devel is a noarch: generic package that is built for
# cross-compilers as well. Instead of skipping for cross-compilers,
# let's prioritize the native compilers package
{% if target_platform == cross_target_platform %}
{% set libgcc_devel_build_num = build_num + 100 %}
{% else %}
{% set libgcc_devel_build_num = build_num %}
{% endif %}

{% if cross_target_platform is not defined %}
{% set cross_target_platform = "linux-64" %}
{% endif %}

package:
  name: gcc_compilers
  version: {{ version }}

# conda-build jcmorin/ --no-remove-work-dir 2>&1 | tee jcmorin/ctng-compilers-feedstock/output.log
# * `gcc-toolset-15-gcc` for rocky 8: https://git.rockylinux.org/staging/rpms/gcc-toolset-15-gcc/-/tree/imports/r8/gcc-toolset-15-gcc-15.2.1-7.1.el8_10
# * Upstream build: https://koji.rockylinux.org/koji/buildinfo?buildID=120333
# * gcc source archive: https://sources.build.resf.org/c73799e9cf2ba6937eb0171d429afde186d4a45fe5b7abde6552c0c0d707fef7
# * https://rockylinux.pkgs.org/8/rockylinux-appstream-aarch64/gcc-toolset-15-runtime-15.0-9.el8_10.aarch64.rpm.html
# * Tests for nonshared library: https://git.almalinux.org/rpms/gcc-toolset-15-gcc/src/commit/4d45dd5368467d758b31cda493a5fb92080746fd/gcc-toolset-15-gcc.spec#L1209
# * https://git.almalinux.org/rpms/gcc-toolset-15-gcc/src/commit/4d45dd5368467d758b31cda493a5fb92080746fd/gcc-toolset-15-gcc.spec#L1997

